# Hand-written (not generated by the v_flakes `github` module, which only knows
# Rust jobs): the checks `ts/sites-tools` promises before it may be published —
# types, the eslint layer boundaries, the tests (the shared fixtures in
# tests/fixtures/kitstart included), the build and the tarball's contents.
name: sites-tools
'on':
  pull_request:
    paths:
      - ts/sites-tools/**
      - rust/**
      - gen/**
      - Cargo.*
      - tests/fixtures/kitstart/**
      - .github/workflows/sites-tools.yml
      - flake.nix
      - flake.lock
      - nix/**
  push:
    branches: [main]
    paths:
      - ts/sites-tools/**
      - rust/**
      - gen/**
      - Cargo.*
      - tests/fixtures/kitstart/**
      - .github/workflows/sites-tools.yml
      - flake.nix
      - flake.lock
      - nix/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    name: typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/sites-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `node:sqlite` without a flag needs >= 22.13 (the lead store).
          node-version: '22.14'
          cache: npm
          cache-dependency-path: ts/sites-tools/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify the tarball
        run: node scripts/verify-pack.mjs

  # `template/` built as a brand would — against the packed tarball — through
  # `next build`, its own tests, the bundle budget, a live standalone server
  # and its quote-form e2e: the only place the factories meet a real Next build.
  template:
    name: template (next build + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/sites-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: ts/sites-tools/package-lock.json
      - name: Install
        run: npm ci
      # The runner is the package's own `@playwright/test`; its browser matches it.
      - name: Install the e2e browser
        run: npx playwright install --with-deps chromium
      - name: Build, smoke and e2e the template
        # The packed version must meet the template's range, and the
        # registry's kit sites-tools' peers, strictly; `sites-tools-registry.yml` covers the
        # published set. `--e2e`: the quote form without and with JavaScript.
        run: npm run check:template -- --e2e

  # `lib.mkLanding` on a stand-in brand: the hermetic npm build from its
  # lockfile, the standalone install checks, the size gate and the OCI image.
  mk-landing:
    name: lib.mkLanding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Build the fixture, its budget check and its image
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.mk-landing-site \
            .#checks.x86_64-linux.mk-landing-budget \
            .#checks.x86_64-linux.mk-landing-container
      - name: Boot the image and hold it to the container contract
        run: nix run .#mk-landing-smoke

  # The Rust port of the core (`rust/`) against the same fixtures, and the
  # generated contract against it.
  rust:
    name: rust kitstart (fixtures, clippy, wasm32, gen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Fixtures
        run: nix develop --command env RUSTC_WRAPPER= cargo test --workspace
      - name: Clippy
        run: nix develop --command env RUSTC_WRAPPER= cargo clippy --workspace --all-targets -- -D warnings
      - name: wasm32
        run: nix develop --command env RUSTC_WRAPPER= cargo check -p kitstart --target wasm32-unknown-unknown
      - name: Generated contract is current
        run: nix run .#gen && git diff --exit-code -- ts/sites-tools/src/generated

  # Renders the widget gallery on the pinned linux stack, publishes the PNGs as
  # the `sites-tools-visual` artifact (the only honest source of baselines — a mac
  # renders different glyphs), and fails when they differ from the committed
  # ones. To accept a change:
  #
  #   rm -f ts/sites-tools/test/visual/__screenshots__/*.png
  #   gh run download <run-id> -n sites-tools-visual -D ts/sites-tools/test/visual/__screenshots__
  visual:
    name: nix run .#sites-tools-visual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Render and capture
        run: nix run .#sites-tools-visual -- --update
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sites-tools-visual
          path: ts/sites-tools/test/visual/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Compare with the committed baselines
        run: |
          changed="$(git status --porcelain -- ts/sites-tools/test/visual/__screenshots__)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::widget baselines differ from this render — review the sites-tools-visual artifact and commit it if intended"
            exit 1
          fi
