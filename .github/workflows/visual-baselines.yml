# Generated by v_flakes `github.visualBaselines`. Refresh the baselines from a run's render:
#
#   rm -f ts/sites-tools/test/visual/__screenshots__/**/*.png
#   gh run download <run-id> -n visual-snapshots -D ts/sites-tools/test/visual/__screenshots__
jobs:
  render:
    name: render baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
      - name: Render
        run: |
          find ts/sites-tools/test/visual/__screenshots__ -name '*.png' -delete
          nix develop --command nix run .#visual-render
      - if: always()
        name: Upload
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: visual-snapshots
          path: ts/sites-tools/test/visual/__screenshots__/**/*.png
          retention-days: 14
      - name: Fail on changed baselines
        run: |
          changed="$(git status --porcelain -- ts/sites-tools/test/visual/__screenshots__)"
          [ -z "$changed" ] && exit 0
          echo "::error::the render changed baselines under ts/sites-tools/test/visual/__screenshots__; refresh them from this run's visual-snapshots"
          echo "$changed"
          exit 1
name: Visual baselines
on:
  pull_request:
    paths:
      - ts/sites-tools/**
      - flake.nix
      - flake.lock
      - .github/workflows/visual-baselines.yml
  workflow_dispatch: {}
permissions:
  contents: read
